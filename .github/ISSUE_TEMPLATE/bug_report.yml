name: Bug report
description: Something in the workspace, agents, MCP server or docs does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not paste real patient data. Every patient in OncoAgent is fictional. For security issues use private reporting (see SECURITY.md)."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: URL or file path (for example /patients/P-001 or app/src/lib/agents/critic.ts)
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ...\n3. See ..."
  - type: input
    id: env
    attributes:
      label: Browser / OS / Node version
